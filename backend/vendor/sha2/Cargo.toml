# Software-only, path-vendored manifest adaptation; see Cargo.toml.upstream and ../metadata-sha256/MANIFEST-ADAPTATIONS.md.
[package]
name = "sha2"
version = "0.10.9"
description = """
Pure Rust implementation of the SHA-2 hash function family
including SHA-224, SHA-256, SHA-384, and SHA-512.
"""
authors = ["RustCrypto Developers"]
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2018"
documentation = "https://docs.rs/sha2"
repository = "https://github.com/RustCrypto/hashes"
keywords = ["crypto", "sha2", "hash", "digest"]
categories = ["cryptography", "no-std"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
digest = { path = "../digest", version = "=0.10.7", default-features = false, features = ["core-api"] }
cfg-if = { path = "../cfg-if", version = "=1.0.4" }

[features]
default = ["std", "force-soft"]
std = ["digest/std"]
force-soft = []
force-soft-compact = []
compress = []

# Recognize unchanged upstream cfgs without exposing removed optional APIs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("asm", "loongarch64_asm", "oid"))'] }
